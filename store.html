<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة توزيع الأدوية</title>
    <script src="navigation.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; color: #333; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* التبويبات */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 16px; font-weight: bold; color: #555; }
        .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* الجداول */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        
        /* الأزرار */
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        
        /* النماذج */
        input[type="number"] { padding: 5px; width: 60px; text-align: center; }
        
        /* التنبيهات */
        .alert { padding: 10px; margin: 10px 0; border-radius: 4px; color: white; display: none; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام ربط الصيدليات ومخازن التوزيع</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pharmacy')">واجهة الصيدلية</button>
        <button class="tab-btn" onclick="switchTab('distributor')">واجهة الموزع</button>
    </div>

    <!-- رسائل التنبيه -->
    <div id="messageBox" class="alert"></div>

    <!-- واجهة الصيدلية -->
    <div id="pharmacy" class="tab-content active">
        <h2>طلب الأدوية</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم الدواء</th>
                    <th>السعر (للوحدة)</th>
                    <th>الكمية المتوفرة</th>
                    <th>الكمية المطلوبة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="pharmacyTableBody">
                <!-- سيتم ملء الجدول بواسطة الجافاسكريبت -->
            </tbody>
        </table>
    </div>

    <!-- واجهة الموزع -->
    <div id="distributor" class="tab-content">
        <h2>إدارة المخزون والطلبات</h2>
        
        <h3>حالة المخزون</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم الدواء</th>
                    <th>السعر</th>
                    <th>الكمية الحالية</th>
                    <th>إضافة مخزون</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <!-- سيتم ملء الجدول بواسطة الجافاسكريبت -->
            </tbody>
        </table>

        <h3>الطلبات الواردة</h3>
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>الدواء</th>
                    <th>الكمية</th>
                    <th>الإجمالي</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- سيتم ملء الجدول بواسطة الجافاسكريبت -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- البيانات الأولية ---
    // في حالة عدم وجود بيانات محفوظة، نستخدم هذه البيانات الافتراضية
    const defaultInventory = [
        { id: 1, name: "بنادول إكسترا", price: 15, stock: 100 },
        { id: 2, name: "فيتامين سي فوار", price: 22, stock: 50 },
        { id: 3, name: "شراب سعال", price: 30, stock: 20 }
    ];

    let inventory = JSON.parse(localStorage.getItem('inventory')) || defaultInventory;
    let orders = JSON.parse(localStorage.getItem('orders')) || [];

    // --- دوال العرض (Rendering) ---

    function renderPharmacyTable() {
        const tbody = document.getElementById('pharmacyTableBody');
        tbody.innerHTML = '';
        inventory.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price} ر.س</td>
                <td>${item.stock}</td>
                <td>
                    <input type="number" id="qty-${item.id}" value="1" min="1" max="${item.stock}">
                </td>
                <td>
                    <button class="btn btn-primary" onclick="placeOrder(${item.id})">طلب</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderDistributorTables() {
        // جدول المخزون
        const invBody = document.getElementById('inventoryTableBody');
        invBody.innerHTML = '';
        inventory.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.price}</td>
                <td>${item.stock}</td>
                <td>
                    <button class="btn btn-success" onclick="addStock(${item.id})">+ 50</button>
                </td>
            `;
            invBody.appendChild(tr);
        });

        // جدول الطلبات
        const ordBody = document.getElementById('ordersTableBody');
        ordBody.innerHTML = '';
        orders.forEach(order => {
            const tr = document.createElement('tr');
            let actionBtn = '';
            if (order.status === 'قيد المعالجة') {
                actionBtn = `<button class="btn btn-primary" onclick="shipOrder(${order.id})">شحن</button>`;
            } else {
                actionBtn = '<span style="color: green;">تم الإنجاز</span>';
            }

            tr.innerHTML = `
                <td>${order.id}</td>
                <td>${order.medName}</td>
                <td>${order.quantity}</td>
                <td>${order.total} ر.س</td>
                <td>${order.status}</td>
                <td>${actionBtn}</td>
            `;
            ordBody.appendChild(tr);
        });
    }

    // --- دوال المنطق (Logic) ---

    function saveData() {
        localStorage.setItem('inventory', JSON.stringify(inventory));
        localStorage.setItem('orders', JSON.stringify(orders));
        updateUI();
    }

    function placeOrder(medId) {
        const qtyInput = document.getElementById(`qty-${medId}`);
        const quantity = parseInt(qtyInput.value);
        const item = inventory.find(i => i.id === medId);

        if (item && quantity > 0 && quantity <= item.stock) {
            // خصم الكمية
            item.stock -= quantity;
            
            // إضافة الطلب
            const newOrder = {
                id: orders.length + 1,
                medId: item.id,
                medName: item.name,
                quantity: quantity,
                total: item.price * quantity,
                status: 'قيد المعالجة'
            };
            orders.push(newOrder);
            
            saveData();
            showMessage('تم إرسال الطلب بنجاح!', 'success');
        } else {
            showMessage('خطأ: الكمية غير متوفرة أو غير صحيحة.', 'error');
        }
    }

    function addStock(medId) {
        const item = inventory.find(i => i.id === medId);
        if (item) {
            item.stock += 50;
            saveData();
            showMessage('تم تحديث المخزون.', 'success');
        }
    }

    function shipOrder(orderId) {
        const order = orders.find(o => o.id === orderId);
        if (order) {
            order.status = 'تم الشحن';
            saveData();
            showMessage(`تم شحن الطلب رقم ${orderId}`, 'success');
        }
    }

    // --- أدوات واجهة المستخدم ---

    function switchTab(tabName) {
        // إخفاء كل المحتويات
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        // إظهار المطلوب
        document.getElementById(tabName).classList.add('active');
        
        // تحديث الزر النشط
        const btnIndex = tabName === 'pharmacy' ? 0 : 1;
        document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');

        updateUI();
    }

    function showMessage(msg, type) {
        const box = document.getElementById('messageBox');
        box.textContent = msg;
        box.className = `alert alert-${type}`;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 3000);
    }

    function updateUI() {
        renderPharmacyTable();
        renderDistributorTables();
    }

    // التشغيل الأولي
    updateUI();

</script>

</body>
</html>
