<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف التيلي سيلز</title>
    <script src="navigation.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            background: linear-gradient(135deg, #dc3545, #c82333);
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        .header-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header .subtitle {
            color: #666;
            font-size: 16px;
        }
        .warehouse-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .warehouse-info .icon {
            font-size: 50px;
        }
        .warehouse-info .details {
            flex: 1;
        }
        .warehouse-info .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .warehouse-info .email {
            font-size: 14px;
            opacity: 0.9;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .stat-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .section {
            background: #f8f9ff;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }
        .required {
            color: #dc3545;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-add:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }
        .employees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .employee-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .employee-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .employee-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .employee-avatar {
            font-size: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .employee-info {
            flex: 1;
        }
        .employee-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .employee-badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .employee-details {
            margin-bottom: 15px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: #666;
            font-size: 14px;
        }
        .detail-icon {
            font-size: 18px;
        }
        .employee-actions {
            display: flex;
            gap: 10px;
        }
        .btn-delete {
            flex: 1;
            background: #dc3545;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .btn-details {
            flex: 1;
            background: #17a2b8;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-details:hover {
            background: #138496;
            transform: translateY(-2px);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .empty-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .empty-subtext {
            font-size: 14px;
            color: #bbb;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.3s;
        }
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .modal-body {
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-weight: bold;
            color: #555;
            min-width: 120px;
        }
        .info-value {
            color: #333;
            flex: 1;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-modal {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-close {
            background: #6c757d;
            color: white;
        }
        .btn-close:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    
    <div class="container">
        <div class="header">
            <div class="header-icon">👥</div>
            <h1>ملف التيلي سيلز</h1>
            <div class="subtitle">إدارة موظفي المبيعات والتسويق</div>
        </div>

        <div class="warehouse-info">
            <div class="icon">🏢</div>
            <div class="details">
                <div class="name" id="warehouseName">اسم المخزن</div>
                <div class="email" id="warehouseEmail">البريد الإلكتروني</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="totalEmployees">0</div>
                <div class="stat-label">إجمالي الموظفين</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">➕ إضافة موظف جديد</div>
            <form onsubmit="handleAddEmployee(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>اسم الموظف <span class="required">*</span></label>
                        <input type="text" id="employeeName" placeholder="أدخل اسم الموظف" required>
                    </div>
                    <div class="form-group">
                        <label>الباسورد <span class="required">*</span></label>
                        <input type="text" id="employeePassword" placeholder="أدخل الباسورد" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-add" id="addBtn">➕ إضافة موظف</button>
            </form>
        </div>

        <div class="section">
            <div class="section-title">📋 قائمة الموظفين</div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن موظف بالاسم أو الباسورد..." oninput="filterEmployees()">
            </div>

            <div class="employees-grid" id="employeesGrid"></div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">👥</div>
                <div class="empty-text">لا يوجد موظفين مسجلين</div>
                <div class="empty-subtext">ابدأ بإضافة أول موظف من القسم أعلاه</div>
            </div>
        </div>
    </div>

    <!-- Modal لعرض التفاصيل -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">📋 تفاصيل الموظف</div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-modal btn-close" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        
        if (!currentUser) {
            alert('يجب تسجيل الدخول أولاً');
            window.location.replace('login.html');
        }

        let allEmployees = [];

        // تحميل معلومات المخزن
        document.getElementById('warehouseName').textContent = currentUser.warehouseName || 'المخزن';
        document.getElementById('warehouseEmail').textContent = currentUser.email || '';

        // تحميل الموظفين
        loadEmployees();

        function loadEmployees() {
            allEmployees = currentUser.employees || [];
            displayEmployees(allEmployees);
            updateStats();
        }

        function displayEmployees(employees) {
            const grid = document.getElementById('employeesGrid');
            const emptyState = document.getElementById('emptyState');

            if (employees.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            grid.innerHTML = '';

            employees.forEach((employee, index) => {
                const card = document.createElement('div');
                card.className = 'employee-card';
                card.innerHTML = `
                    <div class="employee-header">
                        <div class="employee-avatar">👤</div>
                        <div class="employee-info">
                            <div class="employee-name">${employee.name}</div>
                            <span class="employee-badge">✔ نشط</span>
                        </div>
                    </div>
                    <div class="employee-details">
                        <div class="detail-item">
                            <span class="detail-icon">🔑</span>
                            <span>الباسورد: <strong>${employee.password}</strong></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">📧</span>
                            <span>الإيميل: <strong>${currentUser.email}</strong></span>
                        </div>
                    </div>
                    <div class="employee-actions">
                        <button class="btn-details" onclick="showDetails(${index})">📋 التفاصيل</button>
                        <button class="btn-delete" onclick="deleteEmployee(${index})">🗑️ حذف</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('totalEmployees').textContent = allEmployees.length;
        }

        function handleAddEmployee(event) {
            event.preventDefault();

            const name = document.getElementById('employeeName').value.trim();
            const password = document.getElementById('employeePassword').value.trim();

            if (!name || !password) {
                alert('يرجى إدخال جميع البيانات');
                return;
            }

            // التحقق من عدم تكرار الباسورد
            const passwordExists = allEmployees.some(emp => emp.password === password);
            if (passwordExists) {
                alert('هذا الباسورد مستخدم بالفعل، يرجى اختيار باسورد آخر');
                return;
            }

            // إضافة الموظف
            if (!currentUser.employees) {
                currentUser.employees = [];
            }

            currentUser.employees.push({ name, password });

            // حفظ في localStorage
            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            const userIndex = users.findIndex(u => u.email === currentUser.email);
            if (userIndex !== -1) {
                users[userIndex].employees = currentUser.employees;
                localStorage.setItem('registeredUsers', JSON.stringify(users));
            }

            // حفظ في IndexedDB
            const request = indexedDB.open('WarehouseDB', 1);
            request.onsuccess = function() {
                const db = request.result;
                if (db.objectStoreNames.contains('users')) {
                    const tx = db.transaction(['users'], 'readwrite');
                    const store = tx.objectStore('users');
                    const getReq = store.getAll();
                    getReq.onsuccess = function() {
                        const allUsers = getReq.result;
                        const user = allUsers.find(u => u.email === currentUser.email);
                        if (user) {
                            user.employees = currentUser.employees;
                            store.put(user);
                        }
                    };
                }
            };

            sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

            // إعادة تعيين النموذج
            document.getElementById('employeeName').value = '';
            document.getElementById('employeePassword').value = '';

            // إعادة تحميل القائمة
            loadEmployees();

            alert('✅ تم إضافة الموظف بنجاح!');
        }

        function filterEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm) ||
                emp.password.toLowerCase().includes(searchTerm)
            );
            displayEmployees(filtered);
        }

        function showDetails(index) {
            const employee = allEmployees[index];
            if (!employee) return;

            // جلب الأوردرات الخاصة بهذا الموظف
            const orders = currentUser.orders || [];
            const employeeOrders = orders.filter(order => order.employeeName === employee.name);

            // حساب الإجمالي لكل صيدلية
            const pharmacyTotals = {};
            employeeOrders.forEach(order => {
                const pharmacyName = order.pharmacyName || 'غير محدد';
                if (!pharmacyTotals[pharmacyName]) {
                    pharmacyTotals[pharmacyName] = {
                        count: 0,
                        total: 0
                    };
                }
                pharmacyTotals[pharmacyName].count++;
                pharmacyTotals[pharmacyName].total += parseFloat(order.totalPrice || 0);
            });

            // بناء HTML للأوردرات
            let ordersHTML = '';
            if (Object.keys(pharmacyTotals).length > 0) {
                ordersHTML = '<div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0;">';
                ordersHTML += '<div style="font-size: 18px; font-weight: bold; color: #667eea; margin-bottom: 15px; text-align: center;">📊 إحصائيات الأوردرات</div>';
                
                for (const [pharmacyName, data] of Object.entries(pharmacyTotals)) {
                    ordersHTML += `
                        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">🏥 ${pharmacyName}</div>
                            <div style="display: flex; justify-content: space-between; font-size: 14px;">
                                <span>📦 عدد الأوردرات: <strong>${data.count}</strong></span>
                                <span>💰 الإجمالي: <strong>${data.total.toFixed(2)} جنيه</strong></span>
                            </div>
                        </div>
                    `;
                }
                
                // إجمالي كل الأوردرات
                const totalOrders = employeeOrders.length;
                const grandTotal = employeeOrders.reduce((sum, order) => sum + parseFloat(order.totalPrice || 0), 0);
                
                ordersHTML += `
                    <div style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center;">
                        <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">📈 الإجمالي الكلي</div>
                        <div style="display: flex; justify-content: space-around; font-size: 15px;">
                            <span>📦 ${totalOrders} أوردر</span>
                            <span>💰 ${grandTotal.toFixed(2)} جنيه</span>
                        </div>
                    </div>
                `;
                ordersHTML += '</div>';
            } else {
                ordersHTML = `
                    <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px; text-align: center; color: #999;">
                        <div style="font-size: 40px; margin-bottom: 10px;">🔭</div>
                        <div style="font-size: 14px;">لا توجد أوردرات لهذا الموظف حتى الآن</div>
                    </div>
                `;
            }

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="info-row">
                    <div class="info-label">👤 الاسم:</div>
                    <div class="info-value">${employee.name}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">🔑 الباسورد:</div>
                    <div class="info-value">${employee.password}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">📧 الإيميل:</div>
                    <div class="info-value">${currentUser.email}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">🏢 المخزن:</div>
                    <div class="info-value">${currentUser.warehouseName}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">✔ الحالة:</div>
                    <div class="info-value">نشط</div>
                </div>
                ${ordersHTML}
            `;

            document.getElementById('detailsModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function deleteEmployee(index) {
            const employee = allEmployees[index];
            if (!confirm(`هل أنت متأكد من حذف الموظف "${employee.name}"؟\n\nسيتم منعه من تسجيل الدخول فوراً.`)) {
                return;
            }

            currentUser.employees.splice(index, 1);

            // حفظ في localStorage
            const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            const userIndex = users.findIndex(u => u.email === currentUser.email);
            if (userIndex !== -1) {
                users[userIndex].employees = currentUser.employees;
                localStorage.setItem('registeredUsers', JSON.stringify(users));
            }

            // حفظ في IndexedDB
            const request = indexedDB.open('WarehouseDB', 1);
            request.onsuccess = function() {
                const db = request.result;
                if (db.objectStoreNames.contains('users')) {
                    const tx = db.transaction(['users'], 'readwrite');
                    const store = tx.objectStore('users');
                    const getReq = store.getAll();
                    getReq.onsuccess = function() {
                        const allUsers = getReq.result;
                        const user = allUsers.find(u => u.email === currentUser.email);
                        if (user) {
                            user.employees = currentUser.employees;
                            store.put(user);
                        }
                    };
                }
            };

            sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

            loadEmployees();
            alert('✅ تم حذف الموظف بنجاح!');
        }

        function goBack() {
            if (currentUser.userType === 'admin') {
                window.location.replace('admin-dashboard.html');
            } else {
                window.location.replace('menu.html');
            }
        }

        // إغلاق Modal عند الضغط خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('detailsModal');
            if (event.target == modal) {
                closeModal();
            }
        };
    </script>
