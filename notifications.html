<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات</title>
    <script src="navigation.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #dc3545);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.5);
            transition: all 0.3s;
            border: 3px solid white;
            z-index: 1000;
            outline: none;
            user-select: none;
        }
        .back-arrow:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.7);
        }
        .back-arrow:active {
            transform: scale(0.95);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-mark-all {
            background: #667eea;
            color: white;
        }
        .btn-mark-all:hover {
            background: #5568d3;
        }
        .btn-clear {
            background: #dc3545;
            color: white;
        }
        .btn-clear:hover {
            background: #c82333;
        }
        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .notification-item {
            background: #f8f9ff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .notification-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .notification-item.unread {
            background: #fff9e6;
            border-color: #ffc107;
        }
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .notification-icon {
            font-size: 24px;
        }
        .notification-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            flex: 1;
            margin: 0 15px;
        }
        .notification-time {
            font-size: 12px;
            color: #999;
        }
        .notification-body {
            color: #666;
            line-height: 1.6;
        }
        .notification-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        .detail-section {
            margin-bottom: 15px;
        }
        .detail-section-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .detail-item {
            font-size: 14px;
        }
        .detail-label {
            font-weight: bold;
            color: #555;
        }
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        .products-table th {
            background: #f0f0f0;
            padding: 8px;
            text-align: right;
            border: 1px solid #ddd;
        }
        .products-table td {
            padding: 8px;
            border: 1px solid #ddd;
        }
        .gps-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .gps-link:hover {
            text-decoration: underline;
        }
        .unread-badge {
            background: #ffc107;
            color: #333;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .empty-text {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="goBack()" title="رجوع">←</div>
    
    <div class="container">
        <h2>🔔 الإشعارات</h2>
        
        <div class="actions" id="actions" style="display: none;">
            <button class="btn btn-mark-all" onclick="markAllAsRead()">✓ تعليم الكل كمقروء</button>
            <button class="btn btn-clear" onclick="clearAllNotifications()">🗑️ حذف جميع الإشعارات</button>
        </div>
        
        <div class="notification-list" id="notificationList"></div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🔔</div>
            <div class="empty-text">لا توجد إشعارات</div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) window.location.href = 'login.html';
        
        let db;
        let allNotifications = [];
        
        function initDB() {
            const request = indexedDB.open('WarehouseDB', 5);
            
            request.onupgradeneeded = function(e) {
                db = e.target.result;
                
                if (!db.objectStoreNames.contains('notifications')) {
                    const objectStore = db.createObjectStore('notifications', { keyPath: 'id', autoIncrement: true });
                    objectStore.createIndex('userId', 'userId', { unique: false });
                    objectStore.createIndex('isRead', 'isRead', { unique: false });
                    objectStore.createIndex('createdAt', 'createdAt', { unique: false });
                }
            };
            
            request.onsuccess = function() {
                db = request.result;
                loadNotifications();
            };
            
            request.onerror = function() {
                loadNotificationsFromLocalStorage();
            };
        }
        
        function loadNotifications() {
            if (!db) {
                loadNotificationsFromLocalStorage();
                return;
            }
            
            const transaction = db.transaction(['notifications'], 'readonly');
            const objectStore = transaction.objectStore('notifications');
            const index = objectStore.index('userId');
            const request = index.getAll(currentUser.email);
            
            request.onsuccess = function() {
                allNotifications = (request.result || []).sort((a, b) => 
                    new Date(b.createdAt) - new Date(a.createdAt)
                );
                displayNotifications(allNotifications);
            };
            
            request.onerror = function() {
                loadNotificationsFromLocalStorage();
            };
        }
        
        function loadNotificationsFromLocalStorage() {
            const notifications = JSON.parse(localStorage.getItem('notifications')) || [];
            allNotifications = notifications
                .filter(n => n.userId === currentUser.email)
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            displayNotifications(allNotifications);
        }
        
        function displayNotifications(notifications) {
            const listContainer = document.getElementById('notificationList');
            const emptyState = document.getElementById('emptyState');
            const actions = document.getElementById('actions');
            
            if (notifications.length === 0) {
                listContainer.innerHTML = '';
                emptyState.style.display = 'block';
                actions.style.display = 'none';
                return;
            }
            
            emptyState.style.display = 'none';
            actions.style.display = 'flex';
            listContainer.innerHTML = '';
            
            notifications.forEach(notification => {
                const date = new Date(notification.createdAt);
                const timeAgo = getTimeAgo(date);
                
                const notificationDiv = document.createElement('div');
                notificationDiv.className = `notification-item ${!notification.isRead ? 'unread' : ''}`;
                notificationDiv.onclick = () => markAsRead(notification.id);
                
                // بناء جدول المنتجات
                let productsHTML = '';
                if (notification.products && notification.products.length > 0) {
                    productsHTML = `
                        <div class="detail-section">
                            <div class="detail-section-title">📦 المنتجات المطلوبة:</div>
                            <table class="products-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>اسم المنتج</th>
                                        <th>الكمية</th>
                                        <th>السعر</th>
                                        <th>الخصم</th>
                                        <th>الإجمالي</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    notification.products.forEach((product, index) => {
                        const priceAfterDiscount = product.price - (product.price * (product.discount || 0) / 100);
                        const total = priceAfterDiscount * product.quantity;
                        productsHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${product.productName}</td>
                                <td>${product.quantity}</td>
                                <td>${product.price.toFixed(2)} جنيه</td>
                                <td>${product.discount || 0}%</td>
                                <td><strong>${total.toFixed(2)} جنيه</strong></td>
                            </tr>
                        `;
                    });
                    
                    productsHTML += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                
                // رابط GPS
                let gpsHTML = '';
                if (notification.pharmacyGPS && notification.pharmacyGPS.lat && notification.pharmacyGPS.lng) {
                    const gpsUrl = `https://www.google.com/maps?q=${notification.pharmacyGPS.lat},${notification.pharmacyGPS.lng}`;
                    gpsHTML = `
                        <div class="detail-item">
                            <span class="detail-label">📍 الموقع:</span> 
                            <a href="${gpsUrl}" target="_blank" class="gps-link">فتح في خرائط جوجل</a>
                        </div>
                    `;
                }
                
                notificationDiv.innerHTML = `
                    <div class="notification-header">
                        <span class="notification-icon">📦</span>
                        <div class="notification-title">${notification.title}</div>
                        ${!notification.isRead ? '<span class="unread-badge">جديد</span>' : ''}
                        <span class="notification-time">${timeAgo}</span>
                    </div>
                    <div class="notification-body">${notification.message}</div>
                    <div class="notification-details">
                        <div class="detail-section">
                            <div class="detail-section-title">🏪 بيانات الصيدلية:</div>
                            <div class="detail-grid">
                                <div class="detail-item">
                                    <span class="detail-label">الاسم:</span> ${notification.pharmacyName}
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">📞 التليفون:</span> ${notification.pharmacyPhone || '-'}
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">📍 العنوان:</span> ${notification.pharmacyAddress || '-'}
                                </div>
                                ${gpsHTML}
                            </div>
                        </div>
                        
                        <div class="detail-section">
                            <div class="detail-section-title">📋 تفاصيل الأوردر:</div>
                            <div class="detail-grid">
                                <div class="detail-item">
                                    <span class="detail-label">رقم الأوردر:</span> #${notification.orderNumber}
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">التاريخ:</span> ${new Date(notification.orderDate || notification.createdAt).toLocaleDateString('ar-EG')}
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">عدد المنتجات:</span> ${notification.itemsCount}
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">الإجمالي:</span> <strong>${notification.totalAmount.toFixed(2)} جنيه</strong>
                                </div>
                            </div>
                        </div>
                        
                        ${productsHTML}
                    </div>
                `;
                
                listContainer.appendChild(notificationDiv);
            });
        }
        
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'الآن';
            if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
            if (diffHours < 24) return `منذ ${diffHours} ساعة`;
            if (diffDays < 7) return `منذ ${diffDays} يوم`;
            return date.toLocaleDateString('ar-EG');
        }
        
        function markAsRead(notificationId) {
            if (!db) {
                const notifications = JSON.parse(localStorage.getItem('notifications')) || [];
                const index = notifications.findIndex(n => n.id === notificationId);
                if (index !== -1) {
                    notifications[index].isRead = true;
                    localStorage.setItem('notifications', JSON.stringify(notifications));
                    loadNotificationsFromLocalStorage();
                }
                return;
            }
            
            const transaction = db.transaction(['notifications'], 'readwrite');
            const objectStore = transaction.objectStore('notifications');
            const request = objectStore.get(notificationId);
            
            request.onsuccess = function() {
                const notification = request.result;
                if (notification) {
                    notification.isRead = true;
                    objectStore.put(notification);
                    loadNotifications();
                }
            };
        }
        
        function markAllAsRead() {
            if (!db) {
                const notifications = JSON.parse(localStorage.getItem('notifications')) || [];
                notifications.forEach(n => {
                    if (n.userId === currentUser.email) n.isRead = true;
                });
                localStorage.setItem('notifications', JSON.stringify(notifications));
                loadNotificationsFromLocalStorage();
                return;
            }
            
            const transaction = db.transaction(['notifications'], 'readwrite');
            const objectStore = transaction.objectStore('notifications');
            const index = objectStore.index('userId');
            const request = index.openCursor(currentUser.email);
            
            request.onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    const notification = cursor.value;
                    notification.isRead = true;
                    cursor.update(notification);
                    cursor.continue();
                } else {
                    loadNotifications();
                }
            };
        }
        
        function clearAllNotifications() {
            if (!confirm('هل أنت متأكد من حذف جميع الإشعارات؟')) return;
            
            if (!db) {
                const notifications = JSON.parse(localStorage.getItem('notifications')) || [];
                const filtered = notifications.filter(n => n.userId !== currentUser.email);
                localStorage.setItem('notifications', JSON.stringify(filtered));
                loadNotificationsFromLocalStorage();
                return;
            }
            
            const transaction = db.transaction(['notifications'], 'readwrite');
            const objectStore = transaction.objectStore('notifications');
            const index = objectStore.index('userId');
            const request = index.openCursor(currentUser.email);
            
            request.onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    cursor.delete();
                    cursor.continue();
                } else {
                    loadNotifications();
                }
            };
        }
        
        function goBack() {
            window.location.replace('menu.html');
        }
        
        initDB();
    </script>
</body>
</html>
