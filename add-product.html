const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrc2poanh3cGhtdnRocnlmZWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ2NjE5NjEsImV4cCI6MjA1MDIzNzk2MX0.3b7wQ8v7hXkL5yF6Z7mN8pQ9rR0sT1uV2wX3yZ4a5b';

<script>
// تهيئة قاعدة البيانات المحلية
let db;
const dbName = 'WarehouseDB';
const storeName = 'products';

// فتح قاعدة البيانات
function initDB() {
    const request = indexedDB.open(dbName, 1);
    
    request.onerror = function() {
        console.error('فشل في فتح قاعدة البيانات');
    };
    
    request.onsuccess = function(event) {
        db = event.target.result;
        console.log('تم فتح قاعدة البيانات بنجاح');
    };
    
    request.onupgradeneeded = function(event) {
        db = event.target.result;
        
        if (!db.objectStoreNames.contains(storeName)) {
            const objectStore = db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
            objectStore.createIndex('productName', 'productName', { unique: false });
            objectStore.createIndex('price', 'price', { unique: false });
            objectStore.createIndex('quantity', 'quantity', { unique: false });
        }
    };
}

function getCombinedPrice() {
    const intPart = parseInt(document.getElementById('priceInt').value, 10);
    const fracPart = parseInt(document.getElementById('priceFrac').value, 10);
    if (isNaN(intPart) || isNaN(fracPart)) return null;
    const safeFrac = Math.max(0, Math.min(99, fracPart));
    return parseFloat(`${intPart}.${safeFrac.toString().padStart(2, '0')}`);
}

function syncCombinedPrice() {
    const price = getCombinedPrice();
    const hidden = document.getElementById('price');
    if (hidden) {
        hidden.value = price !== null ? price.toFixed(2) : '';
    }
    return price;
}

// التحقق من صحة النموذج
function checkFormValidity() {
    const productName = document.getElementById('productName').value;
    const price = syncCombinedPrice();
    const quantity = document.getElementById('quantity').value;
    const submitBtn = document.getElementById('submitBtn');
    
    if (productName && price !== null && quantity) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
    }
}

// معالجة تقديم النموذج
window.handleSubmit = async function(e) {
    if (e) e.preventDefault();
    
    console.log('📤 بدء عملية إرسال البيانات...');
    
    // دمج السعر (الرقم الصحيح + الكسر)
    const combinedPrice = getCombinedPrice();
    if (combinedPrice === null) {
        showCustomAlert('يرجى إدخال السعر بشكل صحيح', 'warning');
        return;
    }
    
    // التحقق من الحقول المطلوبة
    const productName = document.getElementById('productName').value.trim();
    const quantity = parseInt(document.getElementById('quantity').value);
    
    if (!productName) {
        showCustomAlert('يرجى إدخال اسم المنتج', 'warning');
        return;
    }
    
    if (!quantity || quantity <= 0) {
        showCustomAlert('يرجى إدخال كمية صحيحة', 'warning');
        return;
    }
    
    // تحضير البيانات للإرسال إلى Supabase
    const dataToSend = {
        name: productName,
        quantity: quantity,
        price: combinedPrice,
        discount: parseFloat(document.getElementById('discount').value) || 0,
        production_date: getSplitDate('prod') || null,
        expiry_date: getSplitDate('exp') || null,
        warehouse_id: localStorage.getItem('currentWarehouseId') || 'default',
        created_at: new Date().toISOString()
    };
    
    console.log('📦 البيانات المُعدة للإرسال:', dataToSend);
    
    try {
        // إرسال البيانات مباشرة إلى Supabase
        console.log('🚀 إرسال البيانات إلى Supabase...');
        
        const { data, error } = await supabaseClient
            .from('products')
            .insert([dataToSend])
            .select();
        
        if (error) {
            console.error('❌ خطأ في إرسال البيانات:', error);
            showCustomAlert('فشل في حفظ المنتج: ' + error.message, 'error');
            return;
        }
        
        console.log('✅ تم الإرسال بنجاح:', data);
        
        // حفظ في localStorage كنسخة احتياطية
        const products = JSON.parse(localStorage.getItem('products')) || [];
        const localProduct = {
            id: data[0].id,
            productName: productName,
            price: combinedPrice,
            discount: dataToSend.discount,
            quantity: quantity,
            productionDate: dataToSend.production_date,
            expiryDate: dataToSend.expiry_date,
            warehouse_id: dataToSend.warehouse_id,
            addedDate: dataToSend.created_at
        };
        products.push(localProduct);
        localStorage.setItem('products', JSON.stringify(products));
        
        // حفظ في IndexedDB
        if (db) {
            try {
                const tx = db.transaction([storeName], 'readwrite');
                tx.objectStore(storeName).add(localProduct);
            } catch (e) {
                console.error('خطأ في حفظ البيانات في IndexedDB:', e);
            }
        }
        
        // عرض رسالة نجاح
        showCustomAlert('✅ تم إضافة المنتج بنجاح إلى قاعدة البيانات!', 'success');
        
        // تفريغ جميع الحقول
        document.getElementById('productForm').reset();
        document.getElementById('priceInt').value = '';
        document.getElementById('priceFrac').value = '';
        document.getElementById('price').value = '';
        
        // تحديث حالة الزر
        checkFormValidity();
        
        console.log('🎉 تمت العملية بنجاح!');
        
    } catch (error) {
        console.error('❌ خطأ في الاتصال بـ Supabase:', error);
        showCustomAlert('خطأ في الاتصال بقاعدة البيانات', 'error');
    }
};

// الحصول على التاريخ المقسم
function getSplitDate(prefix) {
    const day = document.getElementById(prefix + 'Day').value || '01';
    const month = document.getElementById(prefix + 'Month').value || '01';
    const year = document.getElementById(prefix + 'Year').value || '2024';
    return `${year}-${month}-${day}`;
}

// العودة للصفحة السابقة
function goBack() {
    window.history.back();
}

// عرض تنبيه مخصص
function showCustomAlert(message, type) {
    const container = document.getElementById('alertContainer');
    let alertColor, alertBg, icon;
    
    if (type === 'success') {
        alertColor = '#155724';
        alertBg = '#d4edda';
        icon = '✅';
    } else if (type === 'warning') {
        alertColor = '#856404';
        alertBg = '#fff3cd';
        icon = '⚠️';
    } else if (type === 'error') {
        alertColor = '#721c24';
        alertBg = '#f8d7da';
        icon = '❌';
    } else {
        alertColor = '#004085';
        alertBg = '#cce5ff';
        icon = 'ℹ️';
    }
    
    container.innerHTML = `
        <div class="alert" style="display:block; padding:15px; margin-top:15px; border-radius:8px; text-align:center; font-weight:600; color: ${alertColor}; background: ${alertBg}; border: 2px solid ${alertColor};">
            ${icon} ${message}
        </div>
    `;
    setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// تهيئة الصفحة عند التحميل
document.addEventListener('DOMContentLoaded', async function() {
    console.log('🔍 تهيئة صفحة إضافة المنتجات...');
    
    // تهيئة قاعدة البيانات
    initDB();
    
    const form = document.getElementById('productForm');
    if (form) {
        const inputs = form.querySelectorAll('input');
        
        // مستمع تقديم النموذج
        form.addEventListener('submit', window.handleSubmit);
        
        // مستمعي التحقق من صحة النموذج
        inputs.forEach(input => {
            input.addEventListener('input', checkFormValidity);
            input.addEventListener('change', checkFormValidity);
        });
        
        // التحقق الأولي
        checkFormValidity();
    }
    
    console.log('✅ تم تهيئة صفحة إضافة المنتجات بنجاح');
});

console.log('✅ تم تحميل ملف إضافة المنتجات');
</script>
