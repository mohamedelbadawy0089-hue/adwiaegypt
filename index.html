<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدويا مصر - النظام الموحد</title>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
    </script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px;">

    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom';
        import { createClient } from '@supabase/supabase-js';

        // بيانات مشروعك المستخرجة مباشرة من صور GitHub
        const SUPABASE_URL = 'https://hess14677-netizen.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc3MxNDY3Ny1uZXRpemVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY4MjY0MTgsImV4cCI6MjAyMjQwMjQxOH0.example';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function AdwaaEgyptApp() {
            const [view, setView] = useState('pharmacy');
            const [results, setResults] = useState([]);

            // 1. وظيفة المسح الشامل (طلبك المحفوظ لمسح كافة الأدوية)
            const handleClearEverything = async () => {
                const { error } = await supabase.rpc('delete_all_drugs_every_time', { w_id: 'YOUR_WAREHOUSE_ID' });
                if (!error) {
                    alert("تم تصفير المخزن ومسح كافة الأدوية بنجاح 🗑️");
                    setResults([]);
                } else {
                    alert("عذراً، تأكد من انتهاء العطل الفني وتشغيل كود SQL أولاً.");
                }
            };

            // 2. وظيفة البحث والشراء للصيدلية
            const handleSearch = async (val) => {
                const { data } = await supabase.from('products').select('*, warehouses(*)').textSearch('search_vector', val);
                setResults(data || []);
            };

            // واجهة المستخدم باستخدام React.createElement كما يظهر في صورك
            return React.createElement('div', null,
                React.createElement('nav', { style: { display: 'flex', gap: '15px', marginBottom: '25px' } },
                    React.createElement('button', { 
                        onClick: () => setView('pharmacy'), 
                        style: { padding: '12px', background: view === 'pharmacy' ? '#007bff' : '#fff', color: view === 'pharmacy' ? '#fff' : '#333', border: '1px solid #ddd', borderRadius: '8px', cursor: 'pointer' } 
                    }, 'البحث والشراء 🛒'),
                    React.createElement('button', { 
                        onClick: () => setView('warehouse'), 
                        style: { padding: '12px', background: view === 'warehouse' ? '#dc3545' : '#fff', color: view === 'warehouse' ? '#fff' : '#333', border: '1px solid #ddd', borderRadius: '8px', cursor: 'pointer' } 
                    }, 'إدارة المخزن ⚙️')
                ),
                view === 'pharmacy' ? 
                React.createElement('div', null,
                    React.createElement('input', { 
                        type: 'text', 
                        placeholder: 'ابحث عن اسم الدواء بخصوماته...', 
                        style: { width: '100%', padding: '15px', borderRadius: '12px', border: '1px solid #ccc' },
                        onChange: (e) => handleSearch(e.target.value) 
                    }),
                    results.map(p => React.createElement('div', { key: p.id, style: { background: '#fff', margin: '10px 0', padding: '15px', borderRadius: '12px', boxShadow: '0 2px 5px rgba(0,0,0,0.05)' } }, 
                        React.createElement('h3', null, p.product_name),
                        React.createElement('button', { style: { background: '#007bff', color: 'white', border: 'none', padding: '10px', borderRadius: '5px' } }, 'شراء')
                    ))
                ) : 
                React.createElement('div', { style: { textAlign: 'center', marginTop: '50px' } },
                    React.createElement('button', { 
                        onClick: handleClearEverything, 
                        style: { padding: '25px 50px', background: '#dc3545', color: '#fff', fontSize: '20px', border: 'none', borderRadius: '20px', cursor: 'pointer', boxShadow: '0 5px 15px rgba(220,53,69,0.3)' } 
                    }, 'مسح كافة الأدوية فوراً 🗑️')
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(AdwaaEgyptApp));
    </script>
</body>
</html>
