<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدويا مصر - النظام المدمج</title>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
    </script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px;">

    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'react';
        import ReactDOM from 'react-dom';
        import { createClient } from '@supabase/supabase-js';

        // بيانات مشروعك المستخرجة من الصور
        const SUPABASE_URL = 'https://hess14677-netizen.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc3MxNDY3Ny1uZXRpemVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY4MjY0MTgsImV4cCI6MjAyMjQwMjQxOH0.example';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function AdwaaEgyptApp() {
            const [view, setView] = useState('pharmacy');
            const [results, setResults] = useState([]);

            // 1. وظيفة المسح الشامل (طلبك المحفوظ: حذف الأدوية كل مرة) [cite: 2026-02-01]
            const handleClearEverything = async () => {
                const warehouseId = 'ضع_هنا_ID_المخزن'; // تأكد من وضعه بعد تنفيذ كود SQL
                const { error } = await supabase.rpc('delete_all_drugs_every_time', { w_id: warehouseId }); [cite: 2026-02-01]
                if (!error) {
                    alert("تم تصفير المخزن بنجاح 🗑️");
                    setResults([]);
                } else {
                    alert("خطأ في الاتصال: " + error.message);
                }
            };

            // 2. وظيفة البحث والشراء للصيدلية
            const handleSearch = async (val) => {
                const { data } = await supabase.from('products').select('*, warehouses(*)').textSearch('search_vector', val);
                setResults(data || []);
            };

            return React.createElement('div', null,
                React.createElement('nav', { style: { display: 'flex', gap: '10px', marginBottom: '20px' } },
                    React.createElement('button', { onClick: () => setView('pharmacy'), style: { padding: '10px', borderRadius: '5px' } }, 'بحث الصيدليات 🛒'),
                    React.createElement('button', { onClick: () => setView('warehouse'), style: { padding: '10px', background: '#dc3545', color: '#fff', borderRadius: '5px' } }, 'إدارة المخزن ⚙️')
                ),
                view === 'pharmacy' ? 
                React.createElement('div', null,
                    React.createElement('input', { type: 'text', placeholder: 'ابحث عن دواء بخصم...', style: { width: '100%', padding: '10px' }, onChange: (e) => handleSearch(e.target.value) }),
                    results.map(p => React.createElement('div', { key: p.id, style: { background: '#fff', margin: '10px 0', padding: '10px' } }, p.product_name))
                ) : 
                React.createElement('div', { style: { textAlign: 'center' } },
                    React.createElement('button', { onClick: handleClearEverything, style: { padding: '20px', background: '#dc3545', color: '#fff', fontSize: '18px' } }, 'مسح كافة الأدوية فوراً 🗑️')
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(AdwaaEgyptApp));
    </script>
</body>
</html>
