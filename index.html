<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أدويا مصر | الإدارة السحابية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #007bff; --danger: #dc3545; --success: #28a745; }
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-danger { background: var(--danger); margin-top: 40px; font-size: 14px; padding: 10px 20px; border-radius: 10px; color: white; border: none; cursor: pointer; }
        .item { background: #fff; padding: 15px; margin-top: 12px; border-radius: 12px; border-right: 8px solid var(--primary); text-align: right; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        hr { margin: 30px 0; border: 0; border-top: 1px dashed #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 البحث في مخازن أدويا مصر</h2>
    <input type="text" id="searchInput" placeholder="ابحث عن دواء في السحابة..." oninput="searchInCloud(this.value)">
    <div id="results"></div>

    <hr>

    <h3>📦 إضافة دواء جديد للمخازن</h3>
    <input type="text" id="dName" placeholder="اسم الدواء">
    <input type="number" id="dPrice" placeholder="السعر">
    <select id="dStore">
        <option value="المخزن الرئيسي">المخزن الرئيسي</option>
        <option value="فرع القاهرة">فرع القاهرة</option>
        <option value="فرع الإسكندرية">فرع الإسكندرية</option>
    </select>
    <button class="btn" onclick="saveToCloud()">حفظ في السحابة</button>

    <br>
    <button class="btn btn-danger" onclick="nukeAll()">⚠️ مسح كافة محتويات المتجر</button>
</div>

<script>
    // --- بيانات الربط من واقع صورك ---
    const S_URL = 'https://iksjhjxwhmvthryfeae.supabase.co'; 
    const S_KEY = 'ضع_هنا_مفتاح_anon_key_الخاص_بك'; 
    // ----------------------------

    const _supabase = supabase.createClient(S_URL, S_KEY);

    // وظيفة البحث السحابي المدمجة
    async function searchInCloud(query) {
        const div = document.getElementById('results');
        if (query.length < 2) { div.innerHTML = ""; return; }
        const { data } = await _supabase.from('drugs').select('*').ilike('name', `%${query}%`);
        if (data && data.length > 0) {
            div.innerHTML = data.map(d => `<div class="item"><b>💊 ${d.name}</b> | <b>💰 ${d.price} ج.م</b><br><small>🏬 المخزن: ${d.store_name}</small></div>`).join('');
        } else { div.innerHTML = "<p>عذراً، هذا الدواء غير مسجل في مخازنك.</p>"; }
    }

    // وظيفة الحفظ في المخزن
    async function saveToCloud() {
        const n = document.getElementById('dName').value;
        const p = document.getElementById('dPrice').value;
        const s = document.getElementById('dStore').value;
        if (!n || !p) { alert("من فضلك أكمل بيانات الدواء أولاً"); return; }
        const { error } = await _supabase.from('drugs').insert([{ name: n, price: p, store_name: s }]);
        if (!error) { 
            alert("تم الحفظ بنجاح في السحابة!"); 
            document.getElementById('dName').value = ""; 
            document.getElementById('dPrice').value = ""; 
        }
    }

    // وظيفة المسح الشامل (Nuke)
    async function nukeAll() {
        if (confirm("تحذير: هل تريد مسح كل الأدوية من المتجر فعلياً؟")) {
            const { error } = await _supabase.from('drugs').delete().neq('id', 0);
            if (!error) { alert("تم تنظيف المتجر بالكامل."); location.reload(); }
        }
    }
</script>
</body>
</html
