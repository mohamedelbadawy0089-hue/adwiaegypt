<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوية مصر - احترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-blue: #0984e3;
            --dark-blue: #2d3436;
            --danger-red: #d63031;
            --light-bg: #f5f6fa;
            --white: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 90%;
            max-width: 500px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--light-bg);
        }

        .header h1 {
            color: var(--dark-blue);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status-badge {
            background: #e1f5fe;
            color: var(--main-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .inventory-list {
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .drug-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            border-right: 5px solid var(--main-blue);
        }

        .drug-info h3 { margin: 0; font-size: 16px; }
        .drug-info p { margin: 0; color: #636e72; font-size: 14px; }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-delete {
            background-color: var(--danger-red);
            color: white;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px 0;
            color: #b2bec3;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>متجر أدوية مصر 💊</h1>
        <span class="status-badge">المتجر مفتوح الآن</span>
    </div>

    <div id="inventory" class="inventory-list">
        <div class="drug-item">
            <div class="drug-info">
                <h3>بانادول اكسترا</h3>
                <p>الكمية: 50 علبة</p>
            </div>
            <span style="font-weight: bold; color: var(--main-blue);">60 ج.م</span>
        </div>
        <div class="drug-item">
            <div class="drug-info">
                <h3>أوجمينتين 1جم</h3>
                <p>الكمية: 12 علبة</p>
            </div>
            <span style="font-weight: bold; color: var(--main-blue);">90 ج.م</span>
        </div>
    </div>

    <div id="empty-box" class="empty-state">
        <p>لا توجد أدوية في المخزن حالياً</p>
    </div>

    <div class="actions">
        <button class="btn btn-delete" onclick="handleDeleteAll()">
            ⚠️ مسح جميع الأدوية
        </button>
    </div>
</div>

<script>
    function handleDeleteAll() {
        if (confirm("هل أنت متأكد من مسح جميع بيانات الأدوية من المتجر؟")) {
            // مسح العناصر من الشاشة
            document.getElementById('inventory').style.display = 'none';
            document.getElementById('empty-box').style.display = 'block';
            
            // تنبيه للمستخدم
            alert("تم مسح جميع البيانات بنجاح.");
            
            // ملاحظة: هنا يتم ربط كود Supabase للمسح من قاعدة البيانات مستقبلاً
            console.log("تم تنفيذ أمر الحذف الكلي.");
        }
    }
</script>

</body>
</html>
