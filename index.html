<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أدوية مصر - المتجر الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ddd; }
        input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
        .btn-main { background: #0984e3; color: white; cursor: pointer; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: center; }
        th { background: #0984e3; color: white; }
        /* أيقونة الروبوت العائمة */
        #gemini-fab { position: fixed; bottom: 20px; left: 20px; width: 60px; height: 60px; background: #6c5ce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid white; box-shadow: 0 5px 10px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام أدوية مصر الذكي 🇪🇬</h1>
    
    <div class="card">
        <h3>📦 للمخازن (تحديث تلقائي)</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <input type="text" id="warehouseId" placeholder="كود المخزن">
        <button class="btn-main" onclick="uploadData()">سحب الشيت وتحديث القائمة</button>
    </div>

    <div class="card" style="border: 2px solid #00b894;">
        <h3>🔍 للصيدليات (بحث وأقل سعر)</h3>
        <input type="text" id="searchInput" placeholder="ابحث عن دواء..." onkeyup="loadData()">
    </div>

    <table>
        <thead>
            <tr><th>الصنف</th><th>المخزن</th><th>السعر</th></tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>

<div id="gemini-fab" onclick="startVoice()">🤖</div>

<script>
    const SB_URL = "https://iksjhjxwphmvthryfpxw.supabase.co";
    const SB_KEY = "eyJhY2Nlc3NfdG9rZW4iOiI..."; // حط مفتاحك هنا
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function uploadData() {
        const file = document.getElementById('excelFile').files[0];
        const w_id = document.getElementById('warehouseId').value;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            const finalData = jsonData.map(i => ({
                name: i.name || i['الاسم'] || i['الصنف'],
                price: parseFloat(i.price || i['السعر']),
                warehouse_id: w_id
            }));
            await supabaseClient.from('drugs').delete().eq('warehouse_id', w_id); // مسح القديم
            await supabaseClient.from('drugs').insert(finalData); // رفع الجديد
            alert("تم التحديث!"); loadData();
        };
        reader.readAsArrayBuffer(file);
    }

    async function loadData() {
        const term = document.getElementById('searchInput').value;
        let query = supabaseClient.from('drugs').select('*').order('price', {ascending: true});
        if (term) query = query.ilike('name', `%${term}%`);
        const { data } = await query;
        document.getElementById('dataTable').innerHTML = data.map(i => `<tr><td>${i.name}</td><td>${i.warehouse_id}</td><td>${i.price} ج.م</td></tr>`).join('');
    }

    function startVoice() {
        const rec = new (window.SpeechRecognition || window.webkitRecognition)();
        rec.lang = 'ar-EG';
        rec.onresult = (e) => { 
            document.getElementById('searchInput').value = e.results[0][0].transcript; 
            loadData(); 
        };
        rec.start();
    }
    loadData();
</script>
</body>
</html>
