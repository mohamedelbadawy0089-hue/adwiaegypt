<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوية مصر - النظام الذكي الموحد</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --main: #0984e3; 
            --pharmacy: #00b894; 
            --voice: #6c5ce7; 
            --order: #d63031; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            direction: rtl; 
        }
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
        }
        button { 
            background: var(--main); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: var(--main); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center;">🇪🇬 أدوية مصر</h1>
    
    <div class="card">
        <h3>📦 تحديث بيانات المخزن</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <input type="text" id="warehouseId" placeholder="كود المخزن">
        <button onclick="uploadData()">تحديث المخزون</button>
    </div>

    <div class="card">
        <h3>🔍 بحث الصيدليات</h3>
        <input type="text" id="searchInput" placeholder="ابحث عن دواء..." onkeyup="loadData()">
    </div>

    <table id="resultsTable">
        <thead>
            <tr>
                <th>الدواء</th>
                <th>المخزن</th>
                <th>السعر</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>

<script>
    const supabaseUrl = "https://iksjhjxwphmvthryfpxw.supabase.co";
    const supabaseKey = "eyJhcmciOiJmYXN0YXBpIiwidHlwIjoiSldUIiwiYWxnIjoiSFMyNTYifQ.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrc2poanh3cGhtdnRocnlmcHh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg0MTk3MDMsImV4cCI6MjA1NDAwNTcwM30.F_D_9_Y_your_full_key_here";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function uploadData() {
        const file = document.getElementById('excelFile').files[0];
        const w_id = document.getElementById('warehouseId').value;
        if (!file || !w_id) return alert("اكمل البيانات");

        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            const processed = jsonData.map(item => ({
                name: item.name || item['الاسم'] || item['الصنف'],
                price: parseFloat(item.price || item['السعر'] || item['Price']),
                warehouse_id: w_id
            })).filter(i => i.name && i.price);

            // حذف القديم قبل رفع الجديد لضمان عدم التكرار كما في صورك
            await supabaseClient.from('drugs').delete().eq('warehouse_id', w_id);
            
            const { error } = await supabaseClient.from('drugs').insert(processed);
            if (!error) { 
                alert("تم التحديث بنجاح ✅"); 
                loadData(); 
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function loadData() {
        const term = document.getElementById('searchInput').value;
        let query = supabaseClient.from('drugs').select('*').order('price', { ascending: true });
        if (term) query = query.ilike('name', `%${term}%`);
        
        const { data } = await query;
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML = (data || []).map(item => `
            <tr>
                <td>${item.name}</td>
                <td>${item.warehouse_id}</td>
                <td>${item.price} ج.م</td>
            </tr>
        `).join('');
    }

    // تشغيل تحميل البيانات تلقائيًا عند الفتح كما في السطر 154 بصورك
    loadData();
</script>
</body>
</html>
