<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أدوية مصر - الإدارة الشاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #0984e3; --pharmacy: #00b894; --danger: #d63031; --opt: #6c5ce7; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--main); margin-bottom: 25px; padding-bottom: 10px; }
        .warehouse-box { background: #fff3f3; border: 1px solid #fab1a0; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .btn { border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-clear { background: var(--danger); width: 100%; font-size: 16px; }
        .search-box { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; border: 1px solid #eee; text-align: center; }
        th { background: var(--main); color: white; }
        .btn-del-item { background: var(--opt); padding: 6px 15px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>نظام أدوية مصر الشامل 🇪🇬</h1>
        <p>لوحة تحكم المخازن (حذف اختياري) وبحث الصيدليات</p>
    </div>

    <div class="warehouse-box">
        <h3 style="margin:0 0 10px 0; color: var(--danger);">📦 خيار للمخازن: تصفير المخزن بالكامل</h3>
        <button class="btn btn-clear" onclick="bulkDeleteByWarehouse()">🗑️ تصفير كافة أدوية مخزني فقط (اختياري)</button>
    </div>

    <h3 style="color: var(--pharmacy);">🔍 قسم الصيدليات (البحث عن الأدوية)</h3>
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم الدواء هنا..." onkeyup="loadData()">

    <table>
        <thead>
            <tr>
                <th>اسم الدواء</th>
                <th>كود المخزن</th>
                <th>السعر ج.م</th>
                <th>حذف صنف (اختياري)</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>

<script>
    // بيانات الربط الخاصة بك
    const SB_URL = "https://iksjhjxwphmvthryfpxw.supabase.co"; 
    const SB_KEY = "eyJh......"; // الصق المفتاح الكامل هنا من لوحة Supabase

    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 1. جلب وعرض البيانات مع البحث
    async function loadData() {
        const searchTerm = document.getElementById('searchInput').value;
        let query = supabaseClient.from('drugs').select('*');
        
        if (searchTerm) {
            query = query.ilike('name', `%${searchTerm}%`); // دعم البحث الفوري
        }

        const { data, error } = await query;
        const tableBody = document.getElementById('dataTable');

        if (data) {
            tableBody.innerHTML = data.map(item => `
                <tr>
                    <td><b>${item.name}</b></td>
                    <td>${item.warehouse_id}</td>
                    <td>${item.price} ج.م</td>
                    <td>
                        <button class="btn btn-del-item" onclick="deleteSingleItem('${item.id}')">حذف هذا الصنف</button>
                    </td>
                </tr>
            `).join('');
        }
    }

    // 2. تصفير المخزن بالكامل (اختياري للمخزن)
    async function bulkDeleteByWarehouse() {
        const warehouseId = prompt("أدخل كود المخزن الخاص بك لمسح كافة أدوية هذا المخزن فقط:");
        if (!warehouseId) return;

        const confirmation = confirm(`تنبيه: هل أنت متأكد من مسح جميع أدوية المخزن رقم ${warehouseId}؟ (لن يتأثر الأدمن)`);
        if (confirmation) {
            const { error } = await supabaseClient
                .from('drugs')
                .delete()
                .eq('warehouse_id', warehouseId); // حذف أدوية المخزن المحدد فقط

            if (!error) {
                alert(`تم تصفير المخزن ${warehouseId} بنجاح ✅`);
                loadData();
            } else {
                alert("حدث خطأ، تأكد من كود المخزن.");
            }
        }
    }

    // 3. حذف صنف واحد محدد (اختياري للمخزن)
    async function deleteSingleItem(id) {
        if (confirm("هل تريد حذف هذا الدواء المحدد فقط؟")) {
            const { error } = await supabaseClient
                .from('drugs')
                .delete()
                .eq('id', id);

            if (!error) {
                loadData();
                alert("تم حذف الصنف ✅");
            }
        }
    }

    // تشغيل الجلب التلقائي عند فتح الصفحة
    loadData();
</script>
</body>
</html>
