<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أدوية مصر | مخازن وصيدليات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0984e3;
            --secondary: #27ae60;
            --danger: #d63031;
            --bg: #f0f2f5;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* الهيدر */
        .header { background: var(--primary); color: white; text-align: center; padding: 20px; }
        .tabs { display: flex; background: #eee; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--primary); border-top: 3px solid var(--primary); }

        .content { padding: 20px; display: none; }
        .content.active { display: block; }

        /* الفورم (للمخازن) */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; margin-top: 10px; }
        .btn-save { background: var(--secondary); color: white; }
        .btn-search { background: var(--primary); color: white; }

        /* القائمة (للصيدليات) */
        .drug-card { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: var(--secondary); color: white; padding: 5px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; }
        
        .delete-section { padding: 20px; border-top: 1px solid #eee; }
        .btn-delete { background: var(--danger); color: white; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>منصة أدوية مصر 💊</h1>
        <p>الربط الذكي بين المخازن والصيدليات</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'store-tab')">لوحة المخزن</button>
        <button class="tab-btn" onclick="openTab(event, 'pharmacy-tab')">بحث الصيدليات</button>
    </div>

    <div id="store-tab" class="content active">
        <h3>إضافة دواء جديد للمخزن</h3>
        <input type="text" id="drugName" placeholder="اسم الدواء (مثال: بانادول)">
        <input type="number" id="drugPrice" placeholder="السعر (جنيه)">
        <input type="number" id="drugQty" placeholder="الكمية المتاحة">
        <button class="btn btn-save" onclick="addDrug()">حفظ ونشر المنتج</button>
    </div>

    <div id="pharmacy-tab" class="content">
        <h3>ابحث عن دواء لشرائه</h3>
        <input type="text" id="searchInput" onkeyup="searchDrugs()" placeholder="اكتب اسم الدواء هنا...">
        <div id="results-list">
            <div class="drug-card">
                <div>
                    <strong>كونجستال</strong> <br>
                    <small>السعر: 40 ج | المورد: مخزن الأمل</small>
                </div>
                <button class="buy-btn" onclick="alert('تم إرسال طلب الشراء للمخزن!')">شراء</button>
            </div>
        </div>
    </div>

    <div class="delete-section">
        <button class="btn btn-delete" onclick="handleDeleteAll()">⚠️ مسح كافة منتجات مخزني</button>
    </div>
</div>

<script>
    // تبديل التبويبات
    function openTab(evt, tabName) {
        var i, content, tabBtn;
        content = document.getElementsByClassName("content");
        for (i = 0; i < content.length; i++) { content[i].className = content[i].className.replace(" active", ""); }
        tabBtn = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tabBtn.length; i++) { tabBtn[i].className = tabBtn[i].className.replace(" active", ""); }
        document.getElementById(tabName).className += " active";
        evt.currentTarget.className += " active";
    }

    // وظيفة المخزن: إضافة منتج
    function addDrug() {
        let name = document.getElementById('drugName').value;
        let price = document.getElementById('drugPrice').value;
        if(name && price) {
            alert("تم إضافة " + name + " للمخزن بنجاح وجاري العرض للصيدليات");
            document.getElementById('drugName').value = "";
            document.getElementById('drugPrice').value = "";
        } else {
            alert("يرجى إدخال اسم الدواء والسعر");
        }
    }

    // وظيفة الصيدلية: البحث
    function searchDrugs() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('drug-card');
        for (let i = 0; i < cards.length; i++) {
            if (cards[i].innerText.toLowerCase().includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // زر المسح (الطلب الخاص بك)
    function handleDeleteAll() {
        if(confirm("هل تريد مسح كافة أدوية مخزنك فقط؟")) {
            document.getElementById('results-list').innerHTML = "<p style='text-align:center; color:#999;'>تم تصفير المخزن بنجاح</p>";
            alert("تمت العملية بنجاح");
        }
    }
</script>

</body>
</html>
