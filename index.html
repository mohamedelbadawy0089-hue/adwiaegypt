<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوية مصر - النظام الذكي الموحد</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --main: #0984e3; --pharmacy: #00b894; --danger: #d63031; --voice: #e67e22; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .card { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #eee; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-weight: bold; }
        .btn-main { background: var(--main); color: white; border: none; cursor: pointer; }
        .btn-voice { background: var(--voice); color: white; border: none; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; cursor: pointer; }
        .btn-success { background: var(--pharmacy); color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: var(--main); color: white; }
        .search-box { border: 2px solid var(--pharmacy); background: #f0fff4; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; border-bottom: 3px solid var(--main); margin-bottom: 25px;">
        <h1>نظام أدوية مصر الشامل 🇪🇬</h1>
        <p>إدارة مخازن ذكية وبحث فوري للصيدليات</p>
    </div>

    <div class="card">
        <h3>📦 بوابة المخازن: رفع وتحديث المنتجات</h3>
        <label>رفع ملف إكسيل (يجب أن يحتوي على name و price):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <input type="text" id="warehouseId" placeholder="أدخل كود المخزن (مثال: 101)">
        <button class="btn-main" onclick="uploadExcel()">📂 رفع شيت الإكسيل بالكامل</button>
        <hr>
        <button class="btn-danger" onclick="bulkDelete()">🗑️ حذف كافة أدوية هذا المخزن (تصفير)</button>
    </div>

    <div class="card search-box">
        <h3 style="color: var(--pharmacy);">🔍 بوابة الصيدليات: البحث الذكي</h3>
        <input type="text" id="searchInput" placeholder="اكتب اسم الدواء هنا..." onkeyup="loadData()">
        <button class="btn-voice" onclick="startVoice()">🎙️ ابحث بصوتك</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم الدواء</th>
                <th>كود المخزن</th>
                <th>السعر (ج.م)</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="dataTable"></tbody>
    </table>
</div>

<script>
    // بيانات الربط (URL & Key) الخاصة بمشروعك
    const SB_URL = "https://iksjhjxwphmvthryfpxw.supabase.co";
    const SB_KEY = "eyJh......"; // ضع هنا الـ Anon Key الكامل الخاص بك

    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 1. وظيفة الرفع الجماعي من الإكسيل
    function uploadExcel() {
        const file = document.getElementById('excelFile').files[0];
        const w_id = document.getElementById('warehouseId').value;

        if (!file || !w_id) return alert("يرجى اختيار الملف وإدخال كود المخزن!");

        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet);

            const finalData = jsonData.map(item => ({
                name: item.name,
                price: item.price,
                warehouse_id: w_id
            }));

            const { error } = await supabaseClient.from('drugs').insert(finalData);
            if (!error) {
                alert(`تم رفع ${finalData.length} صنف بنجاح ✅`);
                loadData();
            } else {
                alert("خطأ: تأكد من تسمية أعمدة الإكسيل (name) و (price)");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // 2. وظيفة البحث الصوتي [طلب التفاعل الصوتي]
    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-EG';
        recognition.start();
        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            document.getElementById('searchInput').value = speechToText;
            loadData();
        };
    }

    // 3. جلب البيانات والبحث الفوري
    async function loadData() {
        const term = document.getElementById('searchInput').value;
        let query = supabaseClient.from('drugs').select('*');
        if (term) query = query.ilike('name', `%${term}%`);

        const { data } = await query;
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML = data ? data.map(item => `
            <tr>
                <td><b>${item.name}</b></td>
                <td>${item.warehouse_id}</td>
                <td>${item.price}</td>
                <td><button onclick="deleteSingle('${item.id}')" style="color:red; cursor:pointer; background:none; border:none;">حذف</button></td>
            </tr>
        `).join('') : '';
    }

    // 4. تصفير مخزن بالكامل [طلب تصفير المخزن]
    async function bulkDelete() {
        const w_id = document.getElementById('warehouseId').value;
        if (!w_id) return alert("أدخل كود المخزن أولاً!");
        
        if (confirm(`هل أنت متأكد من حذف كافة أدوية المخزن ${w_id}؟`)) {
            const { error } = await supabaseClient.from('drugs').delete().eq('warehouse_id', w_id);
            if (!error) {
                alert("تم تصفير المخزن بنجاح ✅");
                loadData();
            }
        }
    }

    // 5. حذف صنف واحد
    async function deleteSingle(id) {
        if (confirm("حذف هذا الصنف؟")) {
            await supabaseClient.from('drugs').delete().eq('id', id);
            loadData();
        }
    }

    loadData(); // تحميل أولي للبيانات
</script>

</body>
</html>
