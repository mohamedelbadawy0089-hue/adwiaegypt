<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أدويا مصر | المخازن والبحث الداخلي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 15px; text-align: center; }
        .box { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
        .btn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 95%; font-weight: bold; }
        .btn-danger { background: #dc3545; margin-top: 25px; font-size: 14px; padding: 8px 20px; }
        .item { background: #fff; padding: 15px; margin-top: 10px; border-radius: 10px; border-right: 6px solid #007bff; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="box">
    <h2>🔍 البحث الداخلي في المتجر</h2>
    <input type="text" id="searchInput" placeholder="ابحث في مخازنك..." oninput="internalSearch(this.value)">
    <div id="results"></div>
    <hr style="margin:30px 0; border:1px dashed #eee">
    <h3>📦 إضافة دواء للمخزن</h3>
    <input type="text" id="dName" placeholder="اسم الدواء">
    <input type="number" id="dPrice" placeholder="السعر">
    <select id="dStore">
        <option value="المخزن الرئيسي">المخزن الرئيسي</option>
        <option value="فرع القاهرة">فرع القاهرة</option>
    </select>
    <button class="btn" onclick="saveToSupabase()">حفظ في السحابة</button>
    <button class="btn btn-danger" onclick="nukeAll()">⚠️ مسح كافة محتويات المتجر</button>
</div>
<script>
    // استبدل القيم التالية ببيانات Supabase الخاصة بك لتعمل القاعدة
    const S_URL = 'https://YOUR_PROJECT_URL.supabase.co'; 
    const S_KEY = 'YOUR_ANON_KEY';
    const _supabase = supabase.createClient(S_URL, S_KEY);

    async function internalSearch(q) {
        const div = document.getElementById('results');
        if (q.length < 2) { div.innerHTML = ""; return; }
        const { data } = await _supabase.from('drugs').select('*').ilike('name', `%${q}%`);
        if (data && data.length > 0) {
            div.innerHTML = data.map(d => `<div class="item"><b>💊 ${d.name}</b> | <b>💰 ${d.price} ج.م</b><br><small>🏬 المخزن: ${d.store_name}</small></div>`).join('');
        } else { div.innerHTML = "<p>غير موجود في متجرك.</p>"; }
    }

    async function saveToSupabase() {
        const n = document.getElementById('dName').value;
        const p = document.getElementById('dPrice').value;
        const s = document.getElementById('dStore').value;
        if (!n || !p) { alert("أكمل البيانات"); return; }
        const { error } = await _supabase.from('drugs').insert([{ name: n, price: p, store_name: s }]);
        if (!error) { alert("تم الحفظ!"); location.reload(); }
    }

    async function nukeAll() {
        if (confirm("سيتم تفريغ المتجر نهائياً، هل أنت متأكد؟")) {
            await _supabase.from('drugs').delete().neq('id', 0);
            location.reload();
        }
    }
</script>
</body>
</html>
