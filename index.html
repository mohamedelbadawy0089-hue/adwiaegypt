<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أدوية مصر - الإدارة الموحدة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main: #0984e3; --pharmacy: #00b894; --danger: #d63031; --opt: #6c5ce7; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--main); margin-bottom: 30px; padding-bottom: 10px; }
        
        /* قسم التحكم للمخازن */
        .warehouse-box { background: #fff3f3; border: 1px solid #fab1a0; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
        .btn { border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-clear { background: var(--danger); width: 100%; font-size: 16px; }
        .btn-clear:hover { background: #b71c1c; }
        
        /* قسم البحث للصيدليات */
        .search-box { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; margin-bottom: 25px; outline: none; }
        .search-box:focus { border-color: var(--pharmacy); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 15px; border: 1px solid #eee; text-align: center; }
        th { background: var(--main); color: white; }
        tr:hover { background: #f9f9f9; }
        
        .btn-del-item { background: var(--opt); padding: 6px 15px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>نظام أدوية مصر الشامل 🇪🇬</h1>
        <p>مخازن | صيدليات | إدارة</p>
    </div>

    <div class="warehouse-box">
        <h3 style="margin-top:0; color: var(--danger);">📦 لوحة تحكم المخازن (حذف الأدوية فقط)</h3>
        <p>يمكن للمخزن تصفير كافة منتجاته دفعة واحدة من هنا:</p>
        <button class="btn btn-clear" onclick="bulkDeleteByWarehouse()">🗑️ تصفير مخزني بالكامل (اختياري)</button>
    </div>

    <h3 class="section-title" style="color: var(--pharmacy);">🔍 قسم الصيدليات والبحث الذكي</h3>
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم الدواء هنا..." onkeyup="loadData()">

    <table>
        <thead>
            <tr>
                <th>اسم المنتج</th>
                <th>كود المخزن</th>
                <th>السعر ج.م</th>
                <th>إجراء اختياري</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            </tbody>
    </table>
</div>

<script>
    // بيانات الربط (تأكد من وضع المفتاح الكامل)
    const SB_URL = "https://iksjhjxwphmvthryfpxw.supabase.co"; 
    const SB_KEY = "ضع_هنا_المفتاح_الكامل_الذي_نسخته_من_سوبابيز"; 

    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 1. وظيفة العرض والبحث (للجميع)
    async function loadData() {
        const searchTerm = document.getElementById('searchInput').value;
        let query = supabaseClient.from('drugs').select('*');
        
        if (searchTerm) {
            query = query.ilike('name', `%${searchTerm}%`);
        }

        const { data, error } = await query;
        const tableBody = document.getElementById('dataTable');

        if (data) {
            tableBody.innerHTML = data.map(item => `
                <tr>
                    <td><b>${item.name}</b></td>
                    <td>${item.warehouse_id}</td>
                    <td>${item.price}</td>
                    <td>
                        <button class="btn btn-del-item" onclick="deleteSingleItem('${item.id}')">حذف هذا الصنف</button>
                    </td>
                </tr>
            `).join('');
        }
        if (data && data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4">لا توجد نتائج مطابقة</td></tr>';
        }
    }

    // 2. خيار اختياري: حذف صنف واحد فقط (للمخازن)
    async function deleteSingleItem(id) {
        if (confirm("هل تريد حذف هذا الدواء المحدد فقط؟ (حساب الأدمن لن يتأثر)")) {
            const { error } = await supabaseClient
                .from('drugs')
                .delete()
                .eq('id', id);

            if (!error) {
                loadData();
                alert("تم حذف الصنف بنجاح ✅");
            }
        }
    }

    // 3. خيار اختياري: تصفير المخزن بالكامل (للمخازن)
    async function bulkDeleteByWarehouse() {
        const warehouseId = prompt("أدخل كود المخزن الخاص بك لتصفير كافة أدويته:");
        if (!warehouseId) return;

        const confirmation = confirm(`تحذير: هل أنت متأكد من مسح "جميع" أدوية المخزن رقم ${warehouseId}؟`);
        if (confirmation) {
            const { error } = await supabaseClient
                .from('drugs')
                .delete()
                .eq('warehouse_id', warehouseId);

            if (!error) {
                loadData();
                alert(`تم تصفير المخزن رقم ${warehouseId} بنجاح ✅`);
            } else {
                alert("حدث خطأ، تأكد من صحة كود المخزن.");
            }
        }
    }

    // تشغيل جلب البيانات عند فتح الصفحة
    loadData();
</script>
</body>
</html>
