<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر أدويا مصر</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f7f6; }
        .btn { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-danger { background: #ff4d4d; margin-top: 50px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>مرحباً بكم في أدويا مصر 🇪🇬</h1>
    <p>المتجر الرسمي للصيدليات والمخازن</p>
    
    <div id="drugs-list">جاري تحميل الأدوية...</div>

    <button class="btn btn-danger" onclick="wipeData()">مسح كافة الأدوية (Admin)</button>

    <script>
        const supabase = supabase.createClient('https://iksjhjxwhmvthryfeae.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...');

        async function wipeData() {
            const code = prompt("كود المسح النووي:");
            if (code === "2026") {
                await supabase.from('drugs').delete().neq('id', 0);
                alert("تم تصفير المتجر بنجاح ✅");
                location.reload();
            }
        }
    </script>
</body>
</html>
